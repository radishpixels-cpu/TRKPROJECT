<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="section-1">
        <div class="section-1-bg"></div>
        <div class="hero-top fade-in">The Wedding Of</div>
        <div class="hero-middle fade-in">Rusdi & Imut</div>
        <div class="hero-bottom fade-in">06/07/2067</div>
    </section>

    <section class="section-2">
        <div class="s2-content">
            <div class="s2-left fade-in">
                <h2 class="countdown-title">Hitungan Mundur</h2>
                <div class="countdown">
                    <div class="time-box"><span id="days">00</span><small>Hari</small></div>
                    <div class="time-box"><span id="hours">00</span><small>Jam</small></div>
                    <div class="time-box"><span id="minutes">00</span><small>Menit</small></div>
                    <div class="time-box"><span id="seconds">00</span><small>Detik</small></div>
                </div>
            </div>

            <div class="s2-right fade-in">
                <div class="photo-placeholder-s2"></div>
            </div>
        </div>

        <a href="#" class="save-date-btn fade-in">Lihat Detail Acara</a>
    </section>

    <section class="section-3">
        <div class="s3-left fade-in">
            <h2>The Bride  The Groom</h2>
            <div class="text-slots">
                <p><strong>Rusdi</strong></p>
                <p>Instagram: @ohwakrusdi</p>
                <p><strong>Si Imut</strong></p>
                <p>Instagram: @si_imutnyarusdi</p>
            </div>
        </div>

        <div class="s3-right">
            <div class="profile-card fade-in">
                <div class="profile-photo photo-groom"></div>
                <div class="profile-name">Rusdi</div>
            </div>
            <div class="profile-card fade-in">
                <div class="profile-photo photo-bride"></div>
                <div class="profile-name">Si Imut</div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
